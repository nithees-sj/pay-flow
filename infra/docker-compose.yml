name: payflow
x-app-env: &app-env
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  ACCOUNTS_URL: http://accounts-service:8081
  LEDGER_URL: http://ledger-service:8082
  PAYMENTS_URL: http://payments-service:8083
  NOTIFICATIONS_URL: http://notification-service:8084
  REDIS_HOST: redis
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  DEMO_FUNDING_ENABLED: ${DEMO_FUNDING_ENABLED:-false}
  TOPUP_LIMIT: ${TOPUP_LIMIT:-1000000}
services:
  postgres:
    image: postgres:16
    profiles: [infra, all]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set database password}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD}
      ACCOUNTS_DB_PASSWORD: ${ACCOUNTS_DB_PASSWORD}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD}
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
  redis:
    image: redis:7
    profiles: [infra, all]
    command: [redis-server, --appendonly, "yes", --maxmemory, 128mb, --maxmemory-policy, noeviction]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 192m
  kafka:
    image: payflow-kafka:3.9.1
    build: ./kafka
    profiles: [infra, all]
    hostname: kafka
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx384m
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes: ["kafkadata:/var/lib/kafka/data"]
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    mem_limit: 768m
  gateway:
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    profiles: [all]
    environment:
      <<: *app-env
      PORT: 8080
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      GATEWAY_RATE_LIMIT: ${GATEWAY_RATE_LIMIT:-120}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: 448m
  accounts-service:
    build:
      context: ..
      dockerfile: services/accounts-service/Dockerfile
    profiles: [all]
    environment:
      <<: *app-env
      PAYMENTS_SERVICE_TOKEN: ${PAYMENTS_SERVICE_TOKEN:?Set payments service token}
      ACCOUNTS_SERVICE_TOKEN: ${ACCOUNTS_SERVICE_TOKEN:?Set accounts service token}
      PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/accounts_db
      DB_USER: accounts
      ACCOUNTS_DB_PASSWORD: ${ACCOUNTS_DB_PASSWORD}
    ports: ["127.0.0.1:8081:8081"]
    depends_on:
      postgres:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:8081/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: 448m
  ledger-service:
    build:
      context: ..
      dockerfile: services/ledger-service/Dockerfile
    profiles: [all]
    environment:
      <<: *app-env
      PAYMENTS_SERVICE_TOKEN: ${PAYMENTS_SERVICE_TOKEN:?Set payments service token}
      ACCOUNTS_SERVICE_TOKEN: ${ACCOUNTS_SERVICE_TOKEN:?Set accounts service token}
      PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/ledger_db
      DB_USER: ledger
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD}
    ports: ["127.0.0.1:8082:8082"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:8082/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: 448m
  payments-service:
    build:
      context: ..
      dockerfile: services/payments-service/Dockerfile
    profiles: [all]
    environment:
      <<: *app-env
      PAYMENTS_SERVICE_TOKEN: ${PAYMENTS_SERVICE_TOKEN:?Set payments service token}
      PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/payments_db
      DB_USER: payments
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD}
      RISK_MINUTE_LIMIT: ${RISK_MINUTE_LIMIT:-10}
      RISK_DAILY_LIMIT: ${RISK_DAILY_LIMIT:-10000000}
    ports: ["127.0.0.1:8083:8083"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
      accounts-service:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:8083/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: 448m
  notification-service:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    profiles: [all]
    environment:
      <<: *app-env
      PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/notification_db
      DB_USER: notification
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    ports: ["127.0.0.1:8084:8084"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:8084/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: 448m
  frontend:
    build: ../frontend
    profiles: [all]
    ports: ["127.0.0.1:5173:8080"]
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 64m
volumes:
  pgdata:
  redisdata:
  kafkadata:
