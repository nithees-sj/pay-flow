server.port=${PORT:8080}
spring.application.name=gateway
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
spring.jackson.deserialization.fail-on-unknown-properties=true
payflow.jwt-secret=${JWT_SECRET}
payflow.accounts-token=${ACCOUNTS_SERVICE_TOKEN:}
payflow.payments-token=${PAYMENTS_SERVICE_TOKEN:}
payflow.demo-funding=${DEMO_FUNDING_ENABLED:false}
payflow.topup-limit=${TOPUP_LIMIT:1000000}
payflow.accounts-url=${ACCOUNTS_URL:http://localhost:8081}
payflow.ledger-url=${LEDGER_URL:http://localhost:8082}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s
payflow.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
payflow.rate-limit=${GATEWAY_RATE_LIMIT:120}

logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO
