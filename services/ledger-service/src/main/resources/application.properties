server.port=${PORT:8082}
spring.application.name=ledger-service
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
spring.jackson.deserialization.fail-on-unknown-properties=true
payflow.jwt-secret=${JWT_SECRET}
payflow.accounts-token=${ACCOUNTS_SERVICE_TOKEN:}
payflow.payments-token=${PAYMENTS_SERVICE_TOKEN:}
payflow.demo-funding=${DEMO_FUNDING_ENABLED:false}
payflow.topup-limit=${TOPUP_LIMIT:1000000}
payflow.accounts-url=${ACCOUNTS_URL:http://localhost:8081}
payflow.ledger-url=${LEDGER_URL:http://localhost:8082}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ledger_db}
spring.datasource.username=${DB_USER:ledger}
spring.datasource.password=${LEDGER_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO
