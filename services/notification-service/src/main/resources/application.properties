server.port=${PORT:8084}
spring.application.name=notification-service
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
spring.jackson.deserialization.fail-on-unknown-properties=true
payflow.jwt-secret=${JWT_SECRET}
payflow.accounts-token=${ACCOUNTS_SERVICE_TOKEN:}
payflow.payments-token=${PAYMENTS_SERVICE_TOKEN:}
payflow.demo-funding=${DEMO_FUNDING_ENABLED:false}
payflow.topup-limit=${TOPUP_LIMIT:1000000}
payflow.accounts-url=${ACCOUNTS_URL:http://localhost:8081}
payflow.ledger-url=${LEDGER_URL:http://localhost:8082}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/notification_db}
spring.datasource.username=${DB_USER:notification}
spring.datasource.password=${NOTIFICATION_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.group-id=payflow-notifications-v1
spring.kafka.listener.ack-mode=record

logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO
